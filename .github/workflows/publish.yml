# Publishes this n8n community node package to npm on every version tag push.
#
# n8n requires verified community nodes to be published from GitHub Actions with
# npm provenance. Prefer npm Trusted Publishing so no long-lived npm token is
# stored in GitHub. If Trusted Publishing is not configured yet, such as before
# the first npm publish creates the package, store a granular npm token as the
# repository Actions secret NPM_TOKEN as a fallback.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Use npm with trusted publishing support
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Publishes to npm with a provenance attestation. With npm Trusted
        # Publishing, leave NPM_TOKEN unset and npm uses GitHub OIDC.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
